<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://*.googleusercontent.com; img-src 'self' data: blob: https:; media-src 'self' https: blob:; style-src 'self' 'unsafe-inline'; frame-src https://script.google.com https://script.googleusercontent.com https://*.googleusercontent.com; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
<meta name="theme-color" content="#063b66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi estancia">
<title>Mi estancia · Apartamentos Turísticos Benidorm</title>
<style>
[hidden]{display:none!important}
/* ============================================================================
   MI ESTANCIA · V1.8.0-RC20 · Dirección visual "LUZ"
   ----------------------------------------------------------------------------
   En Benidorm lo característico no es la playa de postal: es la luz. Las dos
   bahías miran en direcciones distintas, así que la mañana y la tarde se leen
   diferentes. La luz es el eje del hilo temporal: la portada cambia de
   temperatura según el momento del viaje.

   Elemento firma: EL ESPINAZO. Una línea vertical real que hace de navegación.
   Lo pasado colapsa en una marca, lo futuro son nodos huecos, y sólo el
   momento actual está abierto sosteniendo la única acción que toca ahora.

   El terracota de los toldos (--toldo) aparece SOLO en urgencia real.
   Cubre las 133 clases del render + las nuevas de Llegar y Moverse.
   ========================================================================== */

/* ------------------------------------------------------------- 1. TOKENS */
:root{
  --sal:#F4F6F5;          /* cal salina: fondo, frío y no crema */
  --cal:#FFFFFF;
  --tinta:#10242E;        /* tinta de mar */
  --mar:#0E4C63;          /* azulejo: estructura */
  --mar-900:#08303F;
  --levante:#1FA1A8;      /* marea: progreso y confirmado */
  --sol:#E8A33D;          /* la luz: acento cálido */
  --toldo:#C7452C;        /* SOLO urgencia */
  --arena:#EADDC8;        /* superficie bloqueada o en espera */
  --verde:#1A7F5A;
  --gris:#5E7480;
  --linea:#DCE6E6;

  /* Alias que LEE el JS: content.apartment.accent escribe --blue.
     Todo el sistema de acción cuelga de aquí. */
  --blue:var(--mar);
  /* compatibilidad con nombres heredados */
  --navy:var(--mar);--cyan:var(--levante);--aqua:#6FD3D0;--coral:var(--toldo);
  --gold:var(--sol);--green:var(--verde);--ink:var(--tinta);--muted:var(--gris);
  --line:var(--linea);--paper:var(--sal);--card:var(--cal);--danger:var(--toldo);

  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--s10:44px;
  --r-s:10px;--r-m:14px;--r-l:20px;--r-xl:26px;
  --shadow:0 16px 40px rgba(8,44,60,.11);
  --shadow-sm:0 2px 10px rgba(8,44,60,.055);

  --display:ui-rounded,'SF Pro Rounded','Segoe UI Variable Display',system-ui,-apple-system,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --data:ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,monospace;

  --ease:cubic-bezier(.22,.61,.36,1);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);

  /* LA LUZ · se desplaza con la fase */
  --luz-a:#08303F;--luz-b:#0E4C63;--luz-c:#1FA1A8;--sobre-luz:#EAF6F7;
}
body[data-phase="arrival"]{--luz-a:#5A3410;--luz-b:#A9691D;--luz-c:#E8A33D;--sobre-luz:#FFF6E6}
body[data-phase="stay"]{--luz-a:#0B4A5E;--luz-b:#15819D;--luz-c:#59CFC9;--sobre-luz:#EDFBFB}
body[data-phase="checkout"]{--luz-a:#1B2A46;--luz-b:#41507A;--luz-c:#9184BC;--sobre-luz:#F0EEF8}
body[data-phase="completed"]{--luz-a:#14342C;--luz-b:#1A7F5A;--luz-c:#5FC79B;--sobre-luz:#EAF8F1}

@media (prefers-color-scheme:dark){
  :root{
    --sal:#07171F;--cal:#0D2430;--tinta:#E6F1F2;--gris:#93AAB4;--linea:#183849;
    --arena:#2C3A38;--mar:#7FCDE6;--shadow:0 16px 40px rgba(0,0,0,.45);
    --shadow-sm:0 2px 10px rgba(0,0,0,.3);
  }
}

/* --------------------------------------------------------------- 2. BASE */
*{box-sizing:border-box}
html{font-size:16px;background:var(--sal);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--sal);color:var(--tinta);
  font-family:var(--body);font-size:.95rem;line-height:1.5;
  min-height:100dvh;padding-bottom:calc(80px + var(--safe-bottom));
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.03em;margin:0}
.hidden{display:none!important}
.screen{display:none}.screen.active{display:block}
:focus-visible{outline:3px solid var(--levante);outline-offset:2px;border-radius:6px}
.ico-svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ico-lg{width:24px;height:24px}
button,.action,.quick,.manual-card,.help-btn,.essential-card,.guide-card,.origin-btn,.next-action{
  transition:transform .12s var(--ease),background-color .18s var(--ease),border-color .18s var(--ease);
}
button:active,.action:active,.quick:active,.manual-card:active,.help-btn:active,
.essential-card:active,.guide-card:active,.next-action:active{transform:scale(.975)}

/* ------------------------------------------------------- 3. BARRA SUPERIOR */
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:var(--s3);
  padding:calc(var(--s3) + var(--safe-top)) var(--s4) var(--s3);
  background:color-mix(in oklab,var(--sal) 86%,transparent);
  backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border-bottom:1px solid var(--linea);
}
.brand{display:flex;align-items:center;gap:var(--s3);flex:1;min-width:0}
.brand-mark{width:32px;height:32px;flex:none;line-height:0}
.brand-copy{min-width:0;line-height:1.18}
.brand-copy strong{
  display:block;font-family:var(--display);font-size:.9rem;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand-copy span{font-size:.68rem;color:var(--gris)}
.lang{
  flex:none;min-height:38px;padding:0 var(--s3);border-radius:999px;
  border:1px solid var(--linea);background:var(--cal);
  color:var(--gris);font-weight:650;font-size:.76rem;
}

/* ------------------------------------------------------------ 4. PORTADA */
.shell{max-width:560px;margin:0 auto}
.hero{
  position:relative;overflow:hidden;color:var(--sobre-luz);
  padding:var(--s8) var(--s5) var(--s10);
  background-color:var(--luz-a);
  background-image:
    radial-gradient(130% 90% at 78% 6%,color-mix(in oklab,var(--luz-c) 42%,transparent),transparent 58%),
    linear-gradient(163deg,var(--luz-a) 0%,var(--luz-b) 62%,var(--luz-c) 150%);
  background-size:cover;background-position:center;
  transition:background-color .8s var(--ease);
}
.hero-content{position:relative;z-index:2}
.eyebrow{
  font-family:var(--data);font-size:.66rem;font-weight:600;letter-spacing:.17em;
  text-transform:uppercase;opacity:.84;font-variant-numeric:tabular-nums;
}
.hero h1{font-size:clamp(2.05rem,9vw,2.85rem);line-height:1;margin:var(--s3) 0 var(--s3);max-width:13ch}
.hero p{margin:0;font-size:.95rem;opacity:.9;max-width:32ch;line-height:1.5}
.metric-line{
  margin-top:var(--s4);display:flex;align-items:center;gap:9px;
  font-family:var(--data);font-variant-numeric:tabular-nums;font-size:.78rem;
}
.metric-line::before{content:"";width:16px;height:1px;background:currentColor;opacity:.5;flex:none}
.metric-line b{font-weight:650}
.metric-line span{opacity:.72}
.hero-status{margin-top:var(--s5);display:flex;gap:var(--s2);flex-wrap:wrap}
.status-pill{
  display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:650;
  padding:6px 11px;border-radius:999px;
  background:color-mix(in oklab,var(--sobre-luz) 16%,transparent);
  border:1px solid color-mix(in oklab,var(--sobre-luz) 22%,transparent);
}
.status-pill.good{background:color-mix(in oklab,var(--verde) 34%,transparent);border-color:color-mix(in oklab,var(--sobre-luz) 30%,transparent)}
.status-pill .ico-svg{width:14px;height:14px}

/* ═══════════════ 5. EL ESPINAZO · elemento firma ═══════════════ */
.content{padding:0 var(--s4) var(--s8)}
.phase-card{
  position:relative;z-index:5;margin-top:calc(var(--s6) * -1);
  background:var(--cal);border-radius:var(--r-xl);padding:var(--s5) var(--s5) var(--s4);
  box-shadow:0 18px 44px rgba(8,44,60,.14);
}
.spine-head{
  font-family:var(--data);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gris);margin-bottom:var(--s4);
}
.node{position:relative;padding-left:30px;padding-bottom:var(--s5)}
.node:last-child{padding-bottom:0}
.node::before{content:"";position:absolute;left:8px;top:10px;bottom:-8px;width:2px;background:var(--linea)}
.node:last-child::before{display:none}
.node.done::before{background:var(--levante)}
.node-dot{
  position:absolute;left:0;top:1px;z-index:2;width:18px;height:18px;border-radius:50%;
  border:2px solid var(--linea);background:var(--cal);display:grid;place-items:center;color:transparent;
}
.node.done .node-dot{background:var(--levante);border-color:var(--levante);color:#fff}
.node.done .node-dot .ico-svg{width:11px;height:11px;stroke-width:2.8}
.node.now .node-dot{
  border-color:var(--luz-c);border-width:3px;
  box-shadow:0 0 0 5px color-mix(in oklab,var(--luz-c) 18%,transparent);
}
.node-title{
  display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);
  font-family:var(--display);font-size:.95rem;font-weight:650;letter-spacing:-.02em;
}
.node.future .node-title{color:var(--gris);font-weight:550}
.node-when{
  font-family:var(--data);font-size:.68rem;color:var(--gris);white-space:nowrap;
  font-variant-numeric:tabular-nums;flex:none;
}
.node-body{margin-top:var(--s3);display:none}
.node.now .node-body{display:block}
.node-note{font-size:.81rem;color:var(--gris);margin:0 0 var(--s3);line-height:1.45}
.next-action{
  display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;
  border:1px solid color-mix(in oklab,var(--luz-c) 34%,transparent);
  background:color-mix(in oklab,var(--luz-c) 8%,var(--cal));
  border-radius:var(--r-m);padding:var(--s3) var(--s4);cursor:pointer;
}
.next-ico{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;background:var(--luz-b);color:var(--sobre-luz)}
.next-copy{flex:1;min-width:0}
.next-copy b{display:block;font-size:.87rem;font-weight:650;letter-spacing:-.01em}
.next-copy span{display:block;font-size:.72rem;color:var(--gris);margin-top:1px}
.next-chev{color:var(--gris);flex:none}
.mini-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-top:var(--s2)}
.mini-action{
  display:flex;align-items:center;justify-content:center;gap:var(--s2);
  font-size:.78rem;font-weight:650;border:1px solid var(--linea);border-radius:var(--r-s);
  padding:10px var(--s3);background:var(--cal);color:var(--tinta);cursor:pointer;min-height:42px;
}
.mini-action .ico-svg{width:16px;height:16px;color:var(--mar)}
.mini-action.urgent{border-color:color-mix(in oklab,var(--toldo) 42%,transparent);color:var(--toldo)}
.mini-action.urgent .ico-svg{color:var(--toldo)}
.progress{height:5px;border-radius:999px;background:var(--linea);margin-top:var(--s4);overflow:hidden}
.progress>span{
  display:block;height:100%;border-radius:inherit;
  background:linear-gradient(90deg,var(--luz-b),var(--luz-c));transition:width .6s var(--ease);
}
/* piezas heredadas del antiguo phase-card, conservadas por compatibilidad */
.phase-row{display:flex;align-items:center;gap:var(--s3)}
.phase-icon{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;background:color-mix(in oklab,var(--luz-c) 14%,var(--cal));color:var(--mar)}
.phase-copy{flex:1;min-width:0}
.phase-copy h2{font-size:1.05rem;color:var(--mar);margin:0 0 2px}
.phase-copy p{margin:0;color:var(--gris);font-size:.78rem;line-height:1.4}

/* Llegar y Moverse son pantallas de referencia con cabecera propia:
   la portada y el espinazo pertenecen a "Ahora". */
body[data-view="travel"] .hero,body[data-view="move"] .hero,
body[data-view="travel"] .phase-card,body[data-view="move"] .phase-card{display:none}
body[data-view="travel"] .content,body[data-view="move"] .content{padding-top:0}

/* ---------------------------------------------------------- 6. SECCIONES */
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);margin:var(--s8) var(--s1) var(--s4)}
.section-head>*:first-child{flex:1;min-width:0}
.section-head h2{font-size:1.25rem;color:var(--mar);letter-spacing:-.035em;overflow-wrap:anywhere}
/* Sólo el <span> hijo directo es el metadato en versalitas. El <p> de una
   cabecera es texto descriptivo y debe fluir con normalidad. */
.section-head>span{
  margin:0;font-family:var(--data);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--gris);white-space:nowrap;flex:none;max-width:46%;text-align:right;
}
.section-head p{margin:var(--s1) 0 0;font-size:.76rem;color:var(--gris);line-height:1.4}
.card{background:var(--cal);border:1px solid var(--linea);border-radius:var(--r-l);padding:var(--s4);box-shadow:var(--shadow-sm)}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);margin-bottom:var(--s3)}
.card-title h3{font-size:.97rem;color:var(--mar)}
.card-title .ico,.card-title .emoji{color:var(--mar)}
.card-actions{display:grid;gap:var(--s2);margin-top:var(--s3)}
.subtle{font-size:.79rem;color:var(--gris);line-height:1.45}
.label{color:var(--gris);font-size:.63rem;font-weight:650;letter-spacing:.1em;text-transform:uppercase;margin-top:var(--s2)}
.metric{font-family:var(--data);font-variant-numeric:tabular-nums;font-size:2rem;font-weight:600;line-height:1;letter-spacing:-.04em;color:var(--mar)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px var(--s2);border-radius:999px;font-size:.66rem;font-weight:700}
.badge.good{color:#0B6247;background:color-mix(in oklab,var(--verde) 15%,var(--cal))}
.badge.wait{color:#7A5307;background:color-mix(in oklab,var(--sol) 26%,var(--cal))}
.badge.lock{color:#6B4A05;background:var(--arena)}
.badge.alert{color:#8E2A12;background:color-mix(in oklab,var(--toldo) 15%,var(--cal))}
.home-summary-stack{display:grid;gap:var(--s3)}
.stay-overview-card{background:var(--cal);border:1px solid var(--linea);border-radius:var(--r-l);padding:var(--s4);box-shadow:var(--shadow-sm)}
.stay-times{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s3)}
.stay-time{background:color-mix(in oklab,var(--mar) 5%,transparent);border-radius:var(--r-m);padding:var(--s3)}
.stay-time b{display:block;font-family:var(--data);font-variant-numeric:tabular-nums;font-size:1.15rem;font-weight:600;letter-spacing:-.02em}
.stay-time span{display:block;font-size:.66rem;color:var(--gris);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.arrival-date{font-family:var(--data);font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--gris)}
.address-detail{font-size:.79rem;color:var(--gris);line-height:1.45;margin-top:var(--s2)}
.maps-hint{font-size:.72rem;color:var(--gris);margin-top:var(--s2)}

/* ------------------------------------------------------------- 7. ACCIÓN */
.actions{display:grid;gap:var(--s2);margin-top:var(--s3)}
.action{
  width:100%;min-height:48px;border:0;border-radius:var(--r-m);padding:var(--s3) var(--s4);
  font-weight:650;font-size:.87rem;cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:var(--s2);text-decoration:none;letter-spacing:-.01em;
}
.action.primary{
  color:#fff;background:var(--blue);
  background:linear-gradient(140deg,var(--blue),color-mix(in oklab,var(--blue) 74%,#08303F));
  box-shadow:0 8px 20px color-mix(in oklab,var(--blue) 28%,transparent);
}
.action.secondary{
  color:var(--mar);background:color-mix(in oklab,var(--blue) 8%,var(--cal));
  border:1px solid color-mix(in oklab,var(--blue) 22%,transparent);
}
.action.success{color:#fff;background:linear-gradient(140deg,#1A7F5A,#16946A)}
.action.danger{color:#fff;background:linear-gradient(140deg,var(--toldo),#DD6248);box-shadow:0 8px 20px rgba(199,69,44,.26)}
.action:disabled{opacity:.42;cursor:not-allowed;box-shadow:none;transform:none}
.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s2)}
.quick{
  border:1px solid var(--linea);background:var(--cal);border-radius:var(--r-m);
  padding:var(--s3) 4px;text-align:center;min-height:84px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:var(--s2);color:var(--tinta);cursor:pointer;box-shadow:var(--shadow-sm);
}
.quick>span:first-child{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  background:color-mix(in oklab,var(--mar) 8%,var(--cal));color:var(--mar);
}
.quick b{font-size:.68rem;font-weight:650;line-height:1.18}

/* --------------------------------------------------- 8. LLEGADA / TIMELINE */
.timeline{display:grid;gap:var(--s3);position:relative}
.step{
  position:relative;background:var(--cal);border:1px solid var(--linea);border-radius:var(--r-l);
  padding:var(--s4);display:grid;grid-template-columns:42px 1fr;gap:var(--s3);box-shadow:var(--shadow-sm);
}
.step-num{
  width:42px;height:42px;border-radius:13px;flex:none;
  background:linear-gradient(150deg,var(--mar),color-mix(in oklab,var(--mar) 62%,var(--levante)));
  color:#fff;font-family:var(--display);font-weight:700;font-size:1.05rem;display:grid;place-items:center;
  box-shadow:0 6px 14px color-mix(in oklab,var(--mar) 28%,transparent);
}
.step h3{font-size:.92rem;margin:2px 0 3px;color:var(--mar)}
.step p{font-size:.8rem;color:var(--gris);line-height:1.45;margin:0}
.step img,.media{width:100%;height:158px;object-fit:cover;border-radius:var(--r-s);margin-top:var(--s3);background:var(--arena)}
.placeholder{
  height:118px;border-radius:var(--r-s);margin-top:var(--s3);display:grid;place-items:center;
  text-align:center;padding:var(--s3);color:#7A6034;font-size:.72rem;font-weight:650;
  background:repeating-linear-gradient(135deg,var(--arena) 0 10px,color-mix(in oklab,var(--arena) 60%,var(--cal)) 10px 20px);
}
.locked{filter:saturate(.2);opacity:.62}
.lock-note{margin-top:var(--s2);padding:var(--s3);border-radius:var(--r-s);background:var(--arena);color:#6B4A05;font-size:.72rem;line-height:1.4}
.journey-first{
  background:linear-gradient(150deg,var(--mar),var(--mar-900));color:#EAF6F7;
  border-radius:var(--r-l);padding:var(--s5);
}
.journey-head{font-family:var(--display);font-size:1.05rem;font-weight:700;letter-spacing:-.025em;margin-bottom:var(--s2)}
.journey-first .subtle{color:rgba(234,246,247,.78)}
.transport-options{display:grid;gap:var(--s2);margin-top:var(--s4)}
.transport-option{
  display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;cursor:pointer;
  border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);
  border-radius:var(--r-m);padding:var(--s3);color:inherit;font-size:.84rem;font-weight:650;
}
.transport-option .ico{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.16)}
.choice-pill{
  display:inline-flex;align-items:center;gap:6px;margin-top:var(--s3);
  padding:6px 11px;border-radius:999px;font-size:.72rem;font-weight:650;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);
}
.guide-grid{display:grid;gap:var(--s2)}
.guide-card{
  display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;cursor:pointer;
  background:var(--cal);border:1px solid var(--linea);border-radius:var(--r-m);padding:var(--s3) var(--s4);
  color:var(--tinta);box-shadow:var(--shadow-sm);
}
.guide-card .ico{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;background:color-mix(in oklab,var(--mar) 8%,transparent);color:var(--mar)}
.guide-card b{display:block;font-size:.85rem;font-weight:650}
.guide-card span{display:block;font-size:.72rem;color:var(--gris);margin-top:1px}
.premium-handover{background:linear-gradient(150deg,color-mix(in oklab,var(--sol) 16%,var(--cal)),var(--cal));border:1px solid color-mix(in oklab,var(--sol) 32%,transparent);border-radius:var(--r-l);padding:var(--s4)}
.premium-kicker{font-family:var(--data);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:#8A5F0C}
.premium-time{font-family:var(--data);font-variant-numeric:tabular-nums;font-size:1.5rem;font-weight:600;letter-spacing:-.03em;margin-top:var(--s2)}
.premium-note{font-size:.79rem;color:var(--gris);line-height:1.45;margin-top:var(--s2)}
.backup-card{background:var(--cal);border:1px dashed var(--linea);border-radius:var(--r-m);padding:var(--s4);margin-top:var(--s3)}
.delay-card,.departure-card{background:var(--cal);border:1px solid var(--linea);border-radius:var(--r-l);padding:var(--s4);box-shadow:var(--shadow-sm)}

/* ═══════════ 9. CÓMO LLEGAR / VOLVER (nuevo) ═══════════ */
.page-head{padding:var(--s6) 0 0}
.page-head h1{font-size:1.75rem;color:var(--mar);letter-spacing:-.035em}
.page-head p{margin:var(--s2) 0 0;font-size:.83rem;color:var(--gris);max-width:34ch;line-height:1.45}
.dir-toggle{display:flex;gap:3px;padding:3px;background:color-mix(in oklab,var(--mar) 8%,transparent);border-radius:999px;margin-top:var(--s4)}
.dir-toggle button{flex:1;padding:9px 6px;border-radius:999px;font-size:.79rem;font-weight:650;color:var(--gris);border:0;background:none;cursor:pointer}
.dir-toggle button.active{background:var(--cal);color:var(--mar);box-shadow:0 1px 4px rgba(8,44,60,.1)}
.origin-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-top:var(--s3)}
.origin-btn{
  display:flex;align-items:center;gap:var(--s3);padding:var(--s3);border-radius:var(--r-m);
  border:1.5px solid var(--linea);background:var(--cal);text-align:left;cursor:pointer;
  font-size:.8rem;font-weight:650;line-height:1.2;color:var(--tinta);
}
.origin-btn .ico{width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center;background:color-mix(in oklab,var(--mar) 8%,transparent);color:var(--mar)}
.origin-btn small{display:block;font-weight:400;font-size:.67rem;color:var(--gris);margin-top:1px}
.origin-btn.active{border-color:var(--mar);background:color-mix(in oklab,var(--mar) 5%,var(--cal))}
.origin-btn.active .ico{background:var(--mar);color:#fff}
.route-card{background:var(--cal);border:1px solid var(--linea);border-radius:var(--r-l);padding:var(--s4);margin-top:var(--s3);box-shadow:var(--shadow-sm)}
.route-card.best{border-color:color-mix(in oklab,var(--levante) 45%,transparent);box-shadow:0 6px 20px color-mix(in oklab,var(--levante) 12%,transparent)}
.route-tag{display:inline-block;font-family:var(--data);font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:var(--levante);color:#fff;margin-bottom:var(--s3);font-weight:650}
.route-top{display:flex;align-items:center;gap:var(--s3)}
.route-top .ico{width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;background:color-mix(in oklab,var(--mar) 8%,transparent);color:var(--mar)}
.route-top h3{font-size:.98rem;letter-spacing:-.02em;color:var(--mar)}
.route-facts{display:flex;gap:var(--s3);margin-top:3px;font-family:var(--data);font-size:.7rem;color:var(--gris);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.route-facts b{color:var(--tinta);font-weight:600}
.route-steps{margin:var(--s4) 0 0;padding:0;list-style:none}
.route-steps li{position:relative;padding:0 0 var(--s3) 26px;font-size:.81rem;line-height:1.45}
.route-steps li::before{content:"";position:absolute;left:5px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--mar);z-index:2}
.route-steps li::after{content:"";position:absolute;left:8px;top:12px;bottom:0;width:1.5px;background:var(--linea)}
.route-steps li:last-child{padding-bottom:0}
.route-steps li:last-child::after{display:none}
.route-steps li b{font-weight:650}
.route-steps li span{display:block;color:var(--gris);font-size:.76rem;margin-top:1px}
.route-tip{display:flex;gap:var(--s3);margin-top:var(--s3);padding:var(--s3);border-radius:var(--r-m);background:color-mix(in oklab,var(--sol) 14%,transparent);font-size:.77rem;line-height:1.45}
.route-tip .ico-svg{color:#8A5F0C;flex:none;margin-top:1px}

/* ═══════════ 10. MOVERSE POR BENIDORM (nuevo) ═══════════ */
.stop-card{background:linear-gradient(150deg,var(--mar),var(--mar-900));color:#EAF6F7;border-radius:var(--r-l);padding:var(--s5)}
.stop-card .label{color:rgba(234,246,247,.75);margin:0}
.stop-card b{display:block;font-family:var(--display);font-size:1.12rem;letter-spacing:-.025em;margin-top:6px}
.stop-card>span{display:block;font-size:.76rem;opacity:.82;margin-top:2px}
.stop-lines{display:flex;gap:6px;margin-top:var(--s4);flex-wrap:wrap}
.stop-lines span{font-family:var(--data);font-size:.75rem;font-weight:650;padding:5px 9px;border-radius:7px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22)}
.mobility-panel{background:var(--cal);border:1px solid var(--linea);border-radius:var(--r-l);padding:var(--s2) var(--s4);box-shadow:var(--shadow-sm)}
.line-row{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--linea)}
.line-row:last-child{border-bottom:0}
.line-badge{
  font-family:var(--data);font-size:.79rem;font-weight:700;flex:none;min-width:44px;text-align:center;
  padding:7px 6px;border-radius:8px;background:var(--mar);letter-spacing:.02em;
}
.line-row span.line-badge{color:#fff;display:inline-block;margin-top:0}
.line-badge.tram{background:var(--levante)}
.line-row div{flex:1;min-width:0}
.line-row div b{display:block;font-size:.82rem;font-weight:650;letter-spacing:-.01em}
.line-row div span{display:block;font-size:.72rem;color:var(--gris);margin-top:1px}
.walk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.walk-grid div{background:var(--cal);border:1px solid var(--linea);border-radius:var(--r-m);padding:var(--s3);text-align:center}
.walk-grid b{display:block;font-family:var(--data);font-size:1.1rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--mar)}
.walk-grid span{display:block;font-size:.68rem;color:var(--gris);margin-top:2px;line-height:1.25}

/* ------------------------------------------------------------ 11. MANUAL */
.manual-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
.manual-card{
  background:var(--cal);border:1px solid var(--linea);border-radius:var(--r-l);padding:var(--s4);
  cursor:pointer;min-height:142px;text-align:left;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;color:var(--tinta);
}
.manual-card .emoji{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in oklab,var(--mar) 8%,var(--cal));color:var(--mar);font-size:1.2rem}
.manual-card h3{font-size:.86rem;margin:var(--s3) 0 3px;color:var(--mar)}
.manual-card p{font-size:.73rem;color:var(--gris);line-height:1.4;margin:0}

/* ------------------------------------- 12. LISTAS (ayuda, esenciales, ops) */
.help-list,.essential-list,.operation-list,.useful-grid,.beach-links{display:grid;gap:var(--s2)}
.help-btn,.essential-card,.operation-card,.useful-card,.safety-card,.waste-card,.beach-card{
  width:100%;border:1px solid var(--linea);background:var(--cal);border-radius:var(--r-l);
  padding:var(--s4);text-align:left;display:flex;align-items:center;gap:var(--s3);
  box-shadow:var(--shadow-sm);color:var(--tinta);text-decoration:none;
}
.essential-card,.essential-card *{text-decoration:none;color:inherit}
.help-btn{cursor:pointer}
.help-btn .ico,.essential-card .ico,.operation-card .ico,.useful-card .ico,.safety-card .ico,.waste-card .ico{
  width:44px;height:44px;border-radius:13px;flex:none;display:grid;place-items:center;
  background:color-mix(in oklab,var(--mar) 8%,var(--cal));color:var(--mar);font-size:1.15rem;
}
.help-btn b,.essential-card b,.operation-card b,.useful-card b,.safety-card b{display:block;font-size:.85rem;font-weight:650;color:var(--mar)}
.help-btn span,.essential-card span,.operation-card span,.useful-card span,.safety-card span{
  display:block;color:var(--gris);font-size:.72rem;margin-top:2px;line-height:1.35;
}
.help-btn.danger,.help-btn.urgent{
  border-color:color-mix(in oklab,var(--toldo) 42%,transparent);
  background:color-mix(in oklab,var(--toldo) 5%,var(--cal));
}
.help-btn.danger .ico,.help-btn.urgent .ico{background:color-mix(in oklab,var(--toldo) 14%,var(--cal));color:var(--toldo)}
.help-btn.danger b,.help-btn.urgent b{color:#A83B22}
.useful-grid{grid-template-columns:1fr}
.useful-actions{display:flex;gap:var(--s2);margin-top:var(--s3);flex-wrap:wrap}
.safety-hero{background:linear-gradient(150deg,color-mix(in oklab,var(--toldo) 12%,var(--cal)),var(--cal));border:1px solid color-mix(in oklab,var(--toldo) 30%,transparent);border-radius:var(--r-l);padding:var(--s4)}
.safety-list{display:grid;gap:var(--s2);margin-top:var(--s3)}
.operation-card{align-items:flex-start}

/* -------------------------------------------------------- 13. FORMULARIOS */
.form{display:grid;gap:var(--s3)}
.field label{display:block;font-size:.64rem;font-weight:700;color:var(--gris);letter-spacing:.09em;text-transform:uppercase;margin-bottom:var(--s2)}
.field input,.field textarea,.field select{
  width:100%;border:2px solid var(--linea);border-radius:var(--r-s);padding:var(--s3);
  background:var(--cal);outline:none;font-size:16px;
  transition:border-color .16s var(--ease),box-shadow .16s var(--ease);
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--mar);box-shadow:0 0 0 4px color-mix(in oklab,var(--mar) 15%,transparent)}
.field textarea{min-height:106px;resize:vertical}
.photo-preview{width:100%;max-height:220px;object-fit:contain;border-radius:var(--r-s);background:var(--arena);margin-top:var(--s2)}
.success-box{background:color-mix(in oklab,var(--verde) 12%,var(--cal));border:1px solid color-mix(in oklab,var(--verde) 34%,transparent);border-radius:var(--r-m);padding:var(--s4);color:#0B6247;font-weight:600}
.warning-box{background:var(--arena);border:1px solid color-mix(in oklab,var(--sol) 45%,transparent);border-radius:var(--r-m);padding:var(--s4);color:#6B4A05}

/* ------------------------------------------------------------- 14. SALIDA */
.checkout-list{display:grid;gap:var(--s2)}
.check-row{
  display:flex;align-items:center;gap:var(--s3);background:var(--cal);border:1px solid var(--linea);
  border-radius:var(--r-m);padding:var(--s3) var(--s4);cursor:pointer;
  transition:border-color .16s var(--ease),background-color .16s var(--ease);
}
.check-row:has(.checkout-check:checked){border-color:color-mix(in oklab,var(--verde) 45%,transparent);background:color-mix(in oklab,var(--verde) 6%,var(--cal))}
.check-row input,.checkout-check{width:23px;height:23px;flex:none;accent-color:var(--verde);cursor:pointer}
.check-row:has(.checkout-check:checked) span{color:var(--gris)}

/* ----------------------------------------------- 15. METEOROLOGÍA Y PLAYAS */
.weather-panel,.beach-panel{background:var(--cal);border:1px solid var(--linea);border-radius:var(--r-l);padding:var(--s4);box-shadow:var(--shadow-sm)}
.weather-head,.beach-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s3)}
.weather-strip{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;margin:0 calc(var(--s4) * -1);padding:0 var(--s4)}
.weather-strip::-webkit-scrollbar{display:none}
.weather-day{flex:none;width:64px;text-align:center;padding:var(--s3) 2px;border-radius:var(--r-s);background:color-mix(in oklab,var(--mar) 5%,transparent)}
.weather-date{display:block;font-family:var(--data);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gris)}
.weather-icon{display:block;font-size:1.35rem;margin:7px 0}
.weather-temp{display:block;font-family:var(--data);font-variant-numeric:tabular-nums;font-size:.82rem;font-weight:600}
.weather-temp i{font-style:normal;color:var(--gris);font-weight:400}
.weather-description{display:block;font-size:.62rem;color:var(--gris);margin-top:3px;line-height:1.2}
.weather-meta{font-size:.7rem;color:var(--gris)}
.weather-advice,.beach-advice{margin-top:var(--s3);padding:var(--s3);border-radius:var(--r-m);background:color-mix(in oklab,var(--sol) 13%,transparent);font-size:.78rem;line-height:1.45}
.weather-empty{font-size:.79rem;color:var(--gris);padding:var(--s3) 0}
.weather-source,.beach-source{margin-top:var(--s3);font-family:var(--data);font-size:.57rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gris);opacity:.85}
.beach-grid{display:grid;gap:var(--s2)}
.beach-card{display:block}
.beach-primary{font-size:.88rem;font-weight:650;color:var(--mar)}
.beach-metrics{display:flex;gap:var(--s3);flex-wrap:wrap;margin-top:var(--s2)}
.beach-metric{font-family:var(--data);font-size:.72rem;color:var(--gris);font-variant-numeric:tabular-nums}
.beach-metric b{color:var(--tinta);font-weight:600}
.beach-water{font-family:var(--data);font-variant-numeric:tabular-nums;font-weight:600}
.beach-warning{margin-top:var(--s3);padding:var(--s3);border-radius:var(--r-m);background:color-mix(in oklab,var(--toldo) 9%,transparent);color:#A83B22;font-size:.77rem;line-height:1.45;font-weight:600}
.beach-link{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:650;color:var(--mar);text-decoration:none}

/* ------------------------------------------------------------ 16. RESIDUOS */
.waste-grid{display:grid;gap:var(--s2)}
.waste-bin{display:flex;align-items:center;gap:var(--s3);padding:var(--s3);border:1px solid var(--linea);border-radius:var(--r-m);background:var(--cal);font-size:.8rem}
.waste-rules{display:grid;gap:var(--s2);margin-top:var(--s3)}
.waste-location{font-size:.79rem;color:var(--gris);line-height:1.45}
.waste-photos{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-top:var(--s3)}
.waste-photo{width:100%;height:118px;object-fit:cover;border-radius:var(--r-s);background:var(--arena)}

/* ------------------------------------------------------- 17. NAVEGACIÓN */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px 6px calc(6px + var(--safe-bottom));
  background:color-mix(in oklab,var(--cal) 88%,transparent);
  backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);
  border-top:1px solid var(--linea);
}
.nav-btn{
  position:relative;border:0;background:transparent;color:var(--gris);min-height:52px;
  padding:3px 2px;border-radius:var(--r-s);font-size:.6rem;font-weight:650;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;
}
.nav-btn.active{color:var(--mar)}
.nav-btn.active::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:20px;height:3px;border-radius:0 0 3px 3px;background:var(--mar)}
.nav-btn b{font-weight:650}

/* --------------------------------------------------------- 18. HOJA MODAL */
.detail{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;background:rgba(4,20,28,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.detail.open{display:flex;animation:veil .22s var(--ease) both}
.detail-sheet{
  width:100%;max-height:90dvh;overflow:auto;background:var(--cal);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:var(--s6) var(--s5) calc(var(--s6) + var(--safe-bottom));
  box-shadow:0 -20px 60px rgba(0,0,0,.28);animation:sheet .3s var(--ease) both;
}
.detail-sheet::before{content:"";display:block;width:40px;height:4px;border-radius:99px;background:var(--linea);margin:calc(var(--s5) * -1 + 2px) auto var(--s4)}
.detail-close{float:right;border:0;background:color-mix(in oklab,var(--mar) 8%,var(--cal));color:var(--mar);border-radius:50%;width:40px;height:40px;font-size:1.2rem;cursor:pointer}
.detail h2{font-size:1.35rem;color:var(--mar);margin:var(--s2) 0 var(--s3);letter-spacing:-.03em}
.detail p{color:var(--gris);line-height:1.6}
.detail img{width:100%;border-radius:var(--r-m);max-height:300px;object-fit:cover}
@keyframes veil{from{opacity:0}to{opacity:1}}
@keyframes sheet{from{transform:translateY(26px)}to{transform:none}}

/* ------------------------------------------------- 19. ESTADOS Y AVISOS */
.loading-screen,.error-screen{min-height:100dvh;padding:calc(48px + var(--safe-top)) var(--s6) calc(var(--s8) + var(--safe-bottom));display:grid;place-items:center}
.state-card{max-width:460px;width:100%;background:var(--cal);border-radius:var(--r-xl);padding:var(--s8) var(--s6);box-shadow:var(--shadow);text-align:center}
.state-icon{font-size:2.6rem;line-height:1}
.state-card h1{font-size:1.4rem;color:var(--mar);margin:var(--s4) 0 var(--s2)}
.spinner{width:38px;height:38px;border:3px solid var(--linea);border-top-color:var(--mar);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto var(--s4)}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{
  position:fixed;z-index:120;left:50%;bottom:calc(86px + var(--safe-bottom));
  transform:translate(-50%,18px);opacity:0;pointer-events:none;
  background:var(--mar-900);color:#fff;border-radius:var(--r-s);padding:var(--s3) var(--s4);
  max-width:min(88vw,460px);font-size:.8rem;font-weight:550;
  box-shadow:0 12px 32px rgba(0,0,0,.3);transition:.24s var(--ease);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------------------------------------------------------- 20. TAMAÑOS */
@media (min-width:700px){
  .content{padding:0 var(--s6) var(--s8)}
  .manual-grid{grid-template-columns:repeat(3,1fr)}
  .hero{border-radius:0 0 var(--r-xl) var(--r-xl)}
  .bottom-nav{left:50%;right:auto;transform:translateX(-50%);width:min(560px,100%);border:1px solid var(--linea);border-bottom:0;border-radius:var(--r-l) var(--r-l) 0 0}
  .detail{align-items:center;justify-content:center}
  .detail-sheet{max-width:560px;border-radius:var(--r-xl);max-height:86dvh}
  .detail-sheet::before{display:none}
}
@media (max-width:380px){
  .quick-grid{grid-template-columns:repeat(2,1fr)}
  .stay-times{grid-template-columns:1fr}
  .nav-btn{font-size:.55rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

.v19-video,.v19-photo{display:block;width:100%;max-height:460px;object-fit:contain;border-radius:12px;margin:12px 0}.v19-video{background:#082d3c;aspect-ratio:16/9}.v19-point,.v19-meeting{margin:16px 0}.v19-meeting h2{font-size:1.4rem}.v19-preview{position:sticky;top:0;z-index:999;background:#ffe9b9;color:#33220b;padding:10px;text-align:center;font-weight:700}.hero{padding-top:20px;padding-bottom:32px}.hero h1{font-size:2rem}.phase-card{margin-top:12px}body[data-view="travel"] .phase-card,body[data-view="apartment"] .phase-card,body[data-view="help"] .phase-card{display:none}
</style>
</head>
<body>
<div id="loading-screen" class="loading-screen"><div class="state-card"><div class="spinner" aria-hidden="true"></div><h1 id="loading-title">Preparando tu estancia</h1><p id="loading-message" class="subtle">Estamos reuniendo la información exacta de tu reserva y apartamento.</p></div></div>
<div id="error-screen" class="error-screen hidden"><div class="state-card"><div class="state-icon" aria-hidden="true">🌊</div><h1 id="error-title">No pudimos abrir tu estancia</h1><p id="error-message" class="subtle"></p><div class="actions"><button id="retry-button" class="action primary" onclick="retryInit()">Volver a intentar</button></div></div></div>

  const delay=Math.min(8000,1500*Math.pow(2,weatherRetryAttempts++));
  weatherRetryTimer=setTimeout(()=>{
    weatherRetryTimer=null;loadGuestWeather()
  },delay)
}
async function loadGuestWeather(){
  if(previewMode||weatherRequestInFlight||!guestSessionToken||!snapshot||snapshot.phase==='completed')return;
  weatherRequestInFlight=true;
  try{
    const r=await api({
      action:'getGuestWeather',guestSessionToken
    },45000);
    if(r&&r.ok&&r.weather){
      snapshot.weather=r.weather;
      renderHome();
      if(r.weather.status==='loading')scheduleWeatherRetry();
      else weatherRetryAttempts=0
    }
  }catch(_e){
    if(snapshot){
      snapshot.weather={
        ...(snapshot.weather||{}),enabled:true,status:'unavailable',days:[]
      };
      renderHome()
    }
  }finally{
    weatherRequestInFlight=false
  }
}
function scheduleBeachRetry(){
  if(beachRetryTimer||beachRetryAttempts>=4)return;
  const delays=[1500,3000,6000,8000],delay=delays[Math.min(beachRetryAttempts,delays.length-1)];
  beachRetryAttempts++;
  beachRetryTimer=setTimeout(()=>{
    beachRetryTimer=null;loadGuestBeach()
  },delay)
}
async function loadGuestBeach(){
  const phase=String(snapshot&&snapshot.phase||'');

  beachRequestInFlight=true;
  try{
    const r=await api({
      action:'getGuestBeach',guestSessionToken
    },45000);
    if(r&&r.ok&&r.beach){
      snapshot.beach=r.beach;
      renderHome();
      if(r.beach.status==='loading')scheduleBeachRetry();
      else beachRetryAttempts=0
    }
  }catch(_e){
    if(snapshot){
      snapshot.beach={
        ...(snapshot.beach||{}),enabled:true,status:'unavailable',beaches:[]

  }finally{
    beachRequestInFlight=false

}
function apartmentDisplayName(){
  const r=snapshot&&snapshot.reservation||{},a=snapshot&&snapshot.content&&snapshot.content.apartment||{};
  const configured=tx(a.displayName).trim();
  if(configured)return configured;
  let alias=String(a.alias||r.apartment||'').replace(/^apartamento\s+/i,'').trim();
  const address=String(a.address||'');
  const match=address.match(/(?:,|\s)(\d+[A-Za-z]?)\b/);
  const number=match?match[1]:'';
  if(number&&!new RegExp('(?:^|\\s)'+number.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?:$|\\s)').test(alias))alias+=' '+number;
  return tx({
    es:'Apartamento '+alias,en:'Apartment '+alias,fr:'Appartement '+alias,de:'Wohnung '+alias

}

function weatherKind(code){
  const n=parseInt(String(code||'').replace(/\D/g,'').slice(0,2),10);
  if(n===11)return['☀️','clear'];
  if(n===12)return['🌤️','mostly_clear'];
  if([13,17].includes(n))return['⛅','partly_cloudy'];
  if(n>=14&&n<=16)return['☁️','cloudy'];
  if(n>=23&&n<=26)return['🌦️','light_rain'];
  if(n>=33&&n<=36)return['🌧️','rain'];
  if((n>=43&&n<=56))return['🌨️','snow'];
  if(n>=61&&n<=76)return['⛈️','storm'];
  if(n===81||n===82)return['🌫️','fog'];
  return['🌤️','variable'];
}

function closeDetail(){

  if(modalReturnFocus&&modalReturnFocus.focus)modalReturnFocus.focus()
}
function openDetailA11y(){
  modalReturnFocus=document.activeElement;
  const d=document.getElementById('detail');
  d.classList.add('open');
  d.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
  setTimeout(()=>d.querySelector('.detail-sheet').focus(),0)
}
document.addEventListener('keydown',e=>{
  const d=document.getElementById('detail');if(!d.classList.contains('open'))return;if(e.key==='Escape'){
    closeDetail();return
  }if(e.key==='Tab'){
    const f=[...d.querySelectorAll('button,[href],input,textarea,select,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled);if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){
      e.preventDefault();last.focus()
    }else if(!e.shiftKey&&document.activeElement===last){
      e.preventDefault();first.focus()
    }
  }
})

/* RC17 · Bloqueo de doble envio. El servidor ya es idempotente, pero dos
   pulsaciones con red lenta generaban dos peticiones y podian producir dos
   avisos Pushover antes de que la primera cerrara. */
let accionEnVuelo=false;
async function conAccionUnica(fn){
  if(accionEnVuelo)return;
  accionEnVuelo=true;
  try{
    await fn()
  }finally{
    accionEnVuelo=false
  }
}
async function confirmEntry(){

      },30000);if(!r||!r.ok)throw new Error(r&&r.error||'Error');snapshot=r.snapshot;renderAll();toast(tr('sent'))
    }catch(e){

    }
  })
}

function openIncident(type,title,priority){
  incidentDraft={
    type,priority,submissionId:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+'_'+Math.random().toString(36).slice(2)),photoBase64:'',photoMimeType:''
  };

async function prepareIncidentPhoto(event){
  const file=event.target.files&&event.target.files[0];
  if(!file)return;
  try{
    const data=await compressImage(file,1500,.76);
    incidentDraft.photoBase64=data.base64;
    incidentDraft.photoMimeType=data.mime;
    const img=document.getElementById('incident-photo-preview');
    img.src='data:'+data.mime+';base64,'+data.base64;
    img.classList.remove('hidden')
  }catch(e){
    toast(errorText(e))
  }event.target.value=''
}
function compressImage(file,maxSide,quality){
  return new Promise(async(resolve,reject)=>{
    if(file.size>8e6)return reject(new Error(tx({
      es:'La fotografía es demasiado grande',en:'The photo is too large',fr:'La photo est trop grande',de:'Das Foto ist zu groß'
    })));let source=null,url='';try{
      if('createImageBitmap'in window)source=await createImageBitmap(file,{
        imageOrientation:'from-image'
      });else{
        source=await new Promise((ok,no)=>{
          const img=new Image();url=URL.createObjectURL(file);img.onload=()=>ok(img);img.onerror=no;img.src=url
        })
      }let w=source.width,h=source.height;if(Math.max(w,h)>maxSide){
        const f=maxSide/Math.max(w,h);w=Math.round(w*f);h=Math.round(h*f)
      }const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(source,0,0,w,h);if(source.close)source.close();if(url)URL.revokeObjectURL(url);resolve({
        base64:c.toDataURL('image/jpeg',quality).split(',')[1],mime:'image/jpeg'
      })
    }catch(_e){
      if(url)URL.revokeObjectURL(url);reject(new Error(tx({
        es:'No se pudo leer la fotografía',en:'The photo could not be read',fr:'Impossible de lire la photo',de:'Das Foto konnte nicht gelesen werden'
      })))
    }
  })
}
async function sendIncident(){
  if(incidentDraft.sending)return;incidentDraft.sending=true;
  const description=document.getElementById('incident-description').value.trim();
  const b=document.querySelector('#detail-content .action.danger');
  let enviado=false;
  try{
    if(b){
      b.disabled=true;
      b.textContent=tr('loading')
    }const r=await api({
      action:'submitGuestIncident',submissionId:incidentDraft.submissionId,guestSessionToken,type:incidentDraft.type,priority:incidentDraft.priority,description,photoBase64:incidentDraft.photoBase64,photoMimeType:incidentDraft.photoMimeType
    },45000);
    if(!r||!r.ok)throw new Error(r&&r.error||'Error');
    enviado=true;
    document.getElementById('detail-content').innerHTML=`<div class="success-box">✓ ${esc(tr('sent'))}<br><small>${esc(r.incidentId||'')}</small></div>`;
    refreshSnapshot();setTimeout(closeDetail,1800)
  }catch(e){
    toast(errorText(e))
  }finally{
    incidentDraft.sending=false;
    /* RC17: sin este bloque el boton quedaba deshabilitado y con el texto "Cargando..." tras un timeout, justo en la incidencia urgente "No puedo entrar". */
    if(!enviado&&b){
      b.disabled=false;
      b.textContent='🛎️ '+tr('send_incident')
    }
  }
}

// V19 · multimedia, complete arrival routes and authenticated read-only preview
let previewMode=false;
function v19Text(es,en,fr,de){return tx({es,en,fr,de});}
function v19Media(x,videoOnly){
 if(!x||x.locked||x.sensitive)return '';
 const photo=safeUrl(x.imageUrl),video=safeUrl(x.videoUrl),poster=safeUrl(x.posterUrl||x.imageUrl);
 const title=tx(x.title)||v19Text('Guía visual','Visual guide','Guide visuel','Visuelle Anleitung');
 return (!videoOnly&&photo?'<img class="v19-photo" loading="lazy" decoding="async" src="'+attr(photo)+'" alt="'+attr(title)+'">':'')+(video?'<video class="v19-video" controls playsinline crossorigin="anonymous" preload="none" '+(poster?'poster="'+attr(poster)+'"':'')+' aria-label="'+attr(title)+'"><source src="'+attr(video)+'" type="video/mp4">'+Object.entries(x.captions||{}).filter(([l,u])=>safeUrl(u)).map(([l,u])=>'<track kind="captions" srclang="'+attr(l)+'" label="'+attr(l.toUpperCase())+'" src="'+attr(safeUrl(u))+'" '+(l===lang?'default':'')+'>').join('')+'</video><p class="subtle">'+esc(v19Text('Si el vídeo no carga, sigue los pasos escritos o abre Ayuda.','If the video does not load, follow the written steps or open Help.','Si la vidéo ne charge pas, suivez les étapes écrites ou ouvrez Aide.','Wenn das Video nicht lädt, folge den Textschritten oder öffne Hilfe.'))+'</p>':'');
}
function v19Point(x,title){
 if(!x||(!tx(x.body)&&!safeUrl(x.mapsUrl)))return '';
 const url=safeUrl(x.mapsUrl);
 return '<article class="card v19-point"><h3>'+esc(tx(x.title)||title)+'</h3><p>'+esc(tx(x.body))+'</p>'+v19Media(x)+(url?'<a class="action secondary" target="_blank" rel="noopener noreferrer" href="'+attr(url)+'">'+esc(v19Text('Abrir punto exacto','Open exact location','Ouvrir le point exact','Genauen Ort öffnen'))+'</a>':'')+'</article>';
}
function v19Meeting(){
 const c=snapshot.coordination||{},arrival=snapshot.content.arrival||{},h=arrival.handover||{};
 const receiver=c.receiver||h.hostName||'Domingo',phone=String(h.phone||'').replace(/[^+0-9]/g,'');
 const state=c.state==='confirmada'?v19Text('Hora confirmada','Confirmed time','Heure confirmée','Bestätigte Uhrzeit'):v19Text('Pendiente de coordinación','Awaiting coordination','En attente de confirmation','Abstimmung ausstehend');
 return '<article class="card v19-meeting"><h2>'+esc(v19Text('Tu encuentro','Your meeting','Votre rendez-vous','Dein Treffpunkt'))+'</h2><p><strong>'+esc(receiver)+'</strong> · '+esc(state)+'</p><p>'+esc(v19Text('Propuesta','Proposed','Proposée','Vorgeschlagen'))+': '+esc(c.proposed||snapshot.reservation.arrivalTime||'—')+' · '+esc(v19Text('Acordada','Agreed','Convenue','Vereinbart'))+': '+esc(c.confirmed||'—')+'</p>'+(phone?'<a class="action secondary" href="tel:'+attr(phone)+'">'+esc(v19Text('Llamar','Call','Appeler','Anrufen'))+' · '+esc(receiver)+'</a>':'')+'<button class="action secondary" onclick="showDelayDialog()">'+esc(v19Text('Voy con retraso','I am delayed','Je suis en retard','Ich verspäte mich'))+'</button></article>'+v19Point(arrival.meeting,v19Text('Punto de encuentro','Meeting point','Point de rencontre','Treffpunkt'));
}
function renderTravel(){
 const el=document.getElementById('view-travel');if(!el||!snapshot)return;
 const guides=travelGuides(),out=travelDirection==='out',saved=snapshot.journey||{};
 if(!travelOrigin||!guides.some(g=>g.id===travelOrigin))travelOrigin=saved.transportId||guides[0]?.id||'';
 const index=guides.findIndex(g=>g.id===travelOrigin),g=guides[index];
 const opts=g?(out?(g.outbound||[]):(g.options||[])):[];
 const a=snapshot.content.arrival||{};
 el.innerHTML='<div class="page-head"><h1>'+esc(tr(out?'travel_title_out':'travel_title_in'))+'</h1><p>'+esc(v19Text('Desde tu origen hasta el punto de encuentro.','From your origin to the meeting point.','De votre départ au point de rencontre.','Von deinem Startpunkt bis zum Treffpunkt.'))+'</p></div>'+
 '<div class="dir-toggle"><button class="'+(!out?'active':'')+'" onclick="setTravelDirection(\'in\')">'+esc(tr('travel_in'))+'</button><button class="'+(out?'active':'')+'" onclick="setTravelDirection(\'out\')">'+esc(tr('travel_out'))+'</button></div>'+
 '<div class="origin-grid">'+guides.map((x,i)=>'<button class="origin-btn '+(x.id===travelOrigin?'active':'')+'" onclick="setTravelOriginByIndex('+i+')">'+ico(travelIconFor(x.id))+' '+esc(tx(x.title))+'</button>').join('')+'</div>'+
 '<p class="subtle">'+esc(v19Text('Estas son alternativas: elige la que encaje con tu viaje. Consulta horarios y condiciones antes de salir.','These are alternatives: choose the one that suits your trip. Check schedules and conditions before leaving.','Ce sont des alternatives : choisissez celle qui vous convient. Consultez les horaires avant le départ.','Dies sind Alternativen. Wähle die passende und prüfe Fahrplan und Bedingungen.'))+'</p>'+
 opts.map((o,i)=>'<article class="route-card"><h3>'+esc(tx(o.title))+'</h3><p>'+esc(tx(o.body))+'</p>'+v19Media(o)+(safeUrl(o.url)?'<a class="action secondary" href="'+attr(safeUrl(o.url))+'" target="_blank" rel="noopener noreferrer">'+esc(v19Text('Consultar opción','Check option','Consulter cette option','Option ansehen'))+'</a>':'')+(!out?'<button class="action primary" onclick="saveJourneyChoiceByIndex('+index+','+i+')">'+esc(saved.transportId===g.id&&saved.optionId===o.id?v19Text('Opción elegida','Selected option','Option choisie','Gewählte Option'):v19Text('Elegir esta opción','Choose this option','Choisir cette option','Diese Option wählen'))+'</button>':'')+'</article>').join('')+
 (out&&!opts.length?'<div class="card"><p>'+esc(v19Text('Consulta con nosotros el recorrido de regreso. No asumimos que las paradas sean las mismas que a la llegada.','Ask us about your return journey. Stops may differ from your arrival.','Contactez-nous pour le retour : les arrêts peuvent différer.','Frage uns nach der Rückfahrt. Die Haltestellen können abweichen.'))+'</p><button class="action secondary" onclick="showView(\'help\')">'+esc(tr('nav_help'))+'</button></div>':'')+
 (!out?v19Meeting()+v19Point(a.dropoff,v19Text('Descarga de equipaje','Luggage drop-off','Dépose des bagages','Gepäck ausladen'))+(a.parkings||[]).map(x=>v19Point(x,v19Text('Aparcamiento','Parking','Parking','Parkplatz'))).join('')+'<div class="section-head"><h2>'+esc(tr('last_meters'))+'</h2></div>'+(a.steps||[]).filter(x=>!x.needsContent).map(x=>v19Point(x,tx(x.title))).join(''):'');
}
function v19PreviewInit(q){
 const origin=q.get('previewOrigin')||'',nonce=decodeURIComponent(location.hash.slice(1));
 if(!/^https:\/\/[a-zA-Z0-9.-]+\.googleusercontent\.com$/.test(origin)&&origin!=='https://script.google.com'){showError(new Error('Preview origin invalid'));return;}
 if(!window.opener){showError(new Error('Open preview from the private panel'));return;}
 let done=false;
 function receive(e){if(e.source!==window.opener||e.origin!==origin||e.data?.type!=='BND_PREVIEW_DATA'||e.data.nonce!==nonce)return;
  done=true;clearInterval(timer);window.removeEventListener('message',receive);previewMode=true;snapshot=e.data.snapshot;reservationId=snapshot.reservation.id;openPortal();
  const bar=document.createElement('div');bar.className='v19-preview';bar.textContent=v19Text('Previsualización · solo lectura · sin registrar aperturas','Preview · read only · no visits recorded','Aperçu · lecture seule · sans enregistrer de visite','Vorschau · nur Lesen · keine Besuchserfassung');document.body.prepend(bar);
 }
 window.addEventListener('message',receive);const ready=()=>window.opener.postMessage({type:'BND_PREVIEW_READY',nonce},origin);const timer=setInterval(ready,700);ready();setTimeout(()=>{if(!done){clearInterval(timer);window.removeEventListener('message',receive);showError(new Error('Preview timed out'));}},60000);
}
document.addEventListener('DOMContentLoaded',init);

async function securityCloseStay(){
  const text=tx({es:'Se cerrará esta sesión. Podrás volver a entrar desde el enlace original de Airbnb.',en:'This session will close. You can reopen the original Airbnb link.',fr:'Cette session sera fermée. Vous pourrez rouvrir le lien Airbnb original.',de:'Diese Sitzung wird geschlossen. Du kannst den ursprünglichen Airbnb-Link wieder öffnen.'});
  if(!confirm(text))return;
  try{
    const result=await api({action:'logoutGuest',guestSessionToken:guestSessionToken,reservaId:reservationId});
    if(!result.ok)throw Error('logout');
    forgetStay();snapshot=null;cleanTokenUrl();location.replace(location.pathname+'?r='+encodeURIComponent(reservationId));
  }catch(_e){alert(tx({es:'No se pudo cerrar la sesión en el servidor. Comprueba la conexión y vuelve a intentarlo.',en:'Could not close the server session. Check your connection and retry.',fr:'Impossible de fermer la session serveur. Vérifiez la connexion.',de:'Serversitzung konnte nicht geschlossen werden. Prüfe die Verbindung.'}));}
}
